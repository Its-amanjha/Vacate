name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-powershell
            os: windows-latest
            shell: powershell
          - name: windows-pwsh
            os: windows-latest
            shell: pwsh
          - name: ubuntu-pwsh
            os: ubuntu-latest
            shell: pwsh
          - name: macos-pwsh
            os: macos-latest
            shell: pwsh
    # A step's own `shell:` cannot use the matrix context; the job default can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show runtime
        run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200

      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if ($PSVersionTable.PSEdition -eq 'Desktop') { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5 -MaximumVersion 5.99 -Repository PSGallery -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Repository PSGallery -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run tests
        run: ./tests/Run-Tests.ps1

      - name: Validate rule catalog
        run: ./vacate.ps1 rules validate

      - name: Validate rule files against the schema
        if: matrix.shell == 'pwsh'
        run: |
          foreach ($platform in @('windows', 'macos', 'linux')) {
            ./tests/Test-RuleFiles.ps1 -Platform $platform
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run performance tests
        if: matrix.shell == 'pwsh'
        run: ./tests/Run-Tests.ps1 -Path tests/perf

      - name: Run lint
        if: matrix.name == 'ubuntu-pwsh'
        run: ./tests/Invoke-Lint.ps1

      # Real read-only scan of the runner. -Redact because CI logs and artifacts are public.
      - name: Sample scan (redacted)
        run: ./vacate.ps1 scan -Redact

      - name: Upload sample report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sample-report-${{ matrix.name }}
          path: runs/
          if-no-files-found: ignore
          retention-days: 7
